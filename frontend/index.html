<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6b2de8" />
    <!-- apply the saved light/dark theme before first paint (see src/theme.tsx) -->
    <script>
      try {
        var t = localStorage.getItem("dm.theme");
        if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <meta name="description" content="«جواب» ایجنت هوش مصنوعی کسب‌وکار شماست: با اطلاعات و محصولات خودتان با مشتری‌ها گفتگو می‌کند، در فروش و پشتیبانی کمک می‌کند و روی کانال‌های ارتباطی شما کار می‌کند." />
    <meta property="og:title" content="جواب — ایجنت هوش مصنوعی برای کسب‌وکار" />
    <meta property="og:description" content="همکار هوشمند کسب‌وکار شما: فروش، پشتیبانی، مشاوره و پیگیری مشتری." />
    <meta property="og:image" content="/brand/javab-mascot-512.png" />
    <title>جواب — ایجنت هوش مصنوعی برای کسب‌وکار</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- If the app can't start (a very old browser), say so instead of showing a blank page. -->
    <div id="boot-fallback" dir="rtl" hidden style="max-width:28rem;margin:4rem auto;padding:0 1rem;font-family:Tahoma,system-ui,sans-serif;text-align:center;color:#1d2939;line-height:1.9">
      <p style="font-size:1.125rem;font-weight:600">جواب</p>
      <p>این صفحه به مرورگر جدیدتری نیاز دارد. لطفا Chrome یا Safari را به‌روز کنید، یا لینک را در مرورگر دیگری باز کنید.</p>
      <p dir="ltr">This page needs a newer browser. Please update Chrome or Safari, or open the link in another browser.</p>
    </div>
    <script>
      (function () {
        function showFallback() {
          var root = document.getElementById("root");
          if (root && !root.firstChild) document.getElementById("boot-fallback").hidden = false;
        }
        window.addEventListener("error", function () { setTimeout(showFallback, 0); });
        setTimeout(showFallback, 8000);
      })();
    </script>
    <script nomodule>
      document.getElementById("boot-fallback").hidden = false;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
